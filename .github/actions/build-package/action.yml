name: Build pstack package
description: >-
  Shared build prologue for every workflow that produces the pstack package:
  validate and scanner-gate. The upstream converter was retired in the
  standalone refactor (issue #156); the package at the package-path input
  is the checked-out tree.

# WHY A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW
# A reusable workflow (`uses: ./.github/workflows/build.yml`) would have to contain
# the caller's ENTIRE job, because a `uses:` job cannot be followed by more steps
# in that same job. All three callers continue past the shared prologue with
# their own steps (ci: artifact upload; release: zip + notes + gh release;
# publish: dist sync), so a reusable workflow cannot express
# this shape without duplicating those steps into the called file. A composite
# action composes into the middle of a job and is the correct tool here.
# The usual reason to prefer a reusable workflow - secrets - does not apply: this
# prologue never reads the `secrets` context.
# Reference: https://docs.github.com/en/actions/concepts/workflows-and-actions/reusing-workflow-configurations

# PERMISSIONS: a composite action cannot declare `permissions:` - that is a
# workflow/job-level concept. Callers MUST set `permissions: contents: read`
# themselves, and the caller's checkout should use persist-credentials: false.

inputs:
  package-path:
    description: Package directory to validate, relative to the workspace.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Stage package path
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: echo "package staged at $PACKAGE_PATH"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
      with:
        enable-cache: true

    - name: Validate
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: uv run --frozen tools/validate.py --package "$PACKAGE_PATH"

    - name: Scanner gate
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: uv run --frozen tools/scanner_gate.py --package "$PACKAGE_PATH"

    # Dual-lock gate (#169): hermes installs Node deps via npm ci, so the
    # shipped package-lock.json must match package.json and carry the same
    # resolved versions as bun.lock. Lives here so every publication path
    # (ci, publish-dist, release) gates on it, not just lint-and-tests.
    - name: Dual lockfile matches package.json (npm ci dry-run)
      shell: bash
      run: npm ci --dry-run --ignore-scripts

    - name: Dual locks agree (bun vs npm versions)
      shell: bash
      run: uv run --frozen python tools/check_dual_lock.py
