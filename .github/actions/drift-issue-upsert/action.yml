name: Upsert drift tracking issue
description: >-
  Idempotently open-or-comment exactly ONE tracking issue, matched by exact title.
  Shared by the drift watchers so the lookup contract - including the fail-loud
  rule that a failed lookup must never create a duplicate - lives in one place.
  The two callers' copies had already drifted apart (different jq expressions
  for the same intent), which is the class of divergence this removes.

# WHY A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW
# Same reasoning as build-package: each caller continues AFTER the shared steps
# with its own logic, and a composite action composes into the middle of a job
# while a reusable workflow would have to own the whole job.
# Reference: https://docs.github.com/en/actions/concepts/workflows-and-actions/reusing-workflow-configurations

# PERMISSIONS: a composite action cannot declare `permissions:` - that is a
# workflow/job-level concept. Callers must grant `issues: write` (the drift
# watchers already do) and set `GH_TOKEN: ${{ github.token }}` is NOT needed;
# this action reads `github.token` directly.

inputs:
  title:
    description: Exact issue title to find; created verbatim when absent.
    required: true
  body-file:
    description: Path to a file holding the issue/comment body.
    required: true

outputs:
  issue-number:
    description: Number of the issue created or commented on.
    value: ${{ steps.upsert.outputs.issue_number }}
  result:
    description: '"created" or "commented".'
    value: ${{ steps.upsert.outputs.result }}

runs:
  using: composite
  steps:
    - id: upsert
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        set -euo pipefail

        existing_number=""
        lookup_status=0

        # Capture the exit status OUTSIDE the command substitution. The inline
        # form this replaces -
        #   existing="$(gh issue list ... || lookup_status=$?)"
        # - set lookup_status inside the $( ) subshell, so the parent never saw
        # it and the guard below could never fire: a failed lookup fell through
        # to issue creation, the exact duplicate the guard exists to prevent.
        # (shellcheck SC2030/SC2031; reproduced in bash before fixing.)
        # The `disable` directive is deliberate: $ENV is a jq builtin read by
        # gh's jq implementation, not a shell expansion shellcheck can evaluate.
        # shellcheck disable=SC2016
        raw="$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
                --json number,title \
                --jq '.[] | select(.title == $ENV.ISSUE_TITLE) | .number')" \
          || lookup_status=$?
        if [ "$lookup_status" -ne 0 ]; then
          echo "::error::issue lookup failed (gh exit $lookup_status); not creating a possible duplicate"
          exit 1
        fi

        # More than one match is only possible if duplicate titles already
        # exist; take the first (oldest) deterministically rather than
        # commenting on an arbitrary one.
        existing_number="$(printf '%s\n' "$raw" | sed -n '1p')"

        if [ -n "$existing_number" ]; then
          gh issue comment "$existing_number" --body-file "$BODY_FILE"
          result="commented"
          issue_number="$existing_number"
        else
          url="$(gh issue create --title "$ISSUE_TITLE" --body-file "$BODY_FILE")"
          result="created"
          issue_number="${url##*/}"
        fi

        echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
        echo "result=$result" >> "$GITHUB_OUTPUT"
        echo "$result tracking issue #$issue_number"
