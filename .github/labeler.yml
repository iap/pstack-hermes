# Path-based PR labels (actions/labeler v7).
# Labels must exist in the repo before this matches — run
# .github/workflows/labels-bootstrap.yml once after publishing to create them.
#
# Matches are additive: a PR gets every label whose changed-files globs match.

pstack-core:
  - changed-files:
      - any-glob-to-any-file: "plugin.yaml"
      - any-glob-to-any-file: "config/**"
      - any-glob-to-any-file: "assets/**"

skills:
  - changed-files:
      - any-glob-to-any-file: "skills/**"

principles:
  - changed-files:
      - any-glob-to-any-file: "skills/principle-*/**"

port:
  - changed-files:
      - any-glob-to-any-file: "patches/**"

tooling:
  - changed-files:
      - any-glob-to-any-file: "tools/**"
      - any-glob-to-any-file: ".github/workflows/**"
      - any-glob-to-any-file: ".github/actions/**"
      - any-glob-to-any-file: "pyproject.toml"
      - any-glob-to-any-file: "uv.lock"
      - any-glob-to-any-file: ".python-version"

documentation:
  - changed-files:
      - any-glob-to-any-file: "README.md"
      - any-glob-to-any-file: "CONTRIBUTING.md"
      - any-glob-to-any-file: "AGENTS.md"
      - any-glob-to-any-file: "SECURITY.md"
      - any-glob-to-any-file: "docs/**"
      - any-glob-to-any-file: "after-install.md"
      - any-glob-to-any-file: "CHANGELOG.md"
