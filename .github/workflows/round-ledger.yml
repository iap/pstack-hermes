name: round-ledger

# Maintains the bot-owned machine block of the PR "Round ledger" comment
# (docs/agent/review-ops.md). The workflow only rewrites the section between
# <!-- round-ledger:auto:start --> and <!-- round-ledger:auto:end -->; the
# triage rows below <!-- round-ledger:manual --> belong to the maintainer /
# agent and are preserved verbatim across runs.
#
# Triggers: pull_request_target (open/sync/reopen/ready) and manual dispatch.
# The repo default GITHUB_TOKEN is read-only (default_workflow_permissions:
# read), so the write-capable base-repo token is required for PR-comment
# mutations (same contract as .github/workflows/labeler.yml). No PR code is
# checked out or executed: every input comes from the API, and fork PRs are
# skipped by the job guard. Bots post issue comments rather than reviews, so
# after bot verdicts land a manual refresh is:
# `gh workflow run round-ledger.yml -f pr=<N>`.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  pull-requests: write # create/edit the ledger comment on the PR conversation
  checks: read         # read the check rollup (Checks API)

concurrency:
  group: round-ledger-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  ledger:
    # Same-repo PRs only (the ledger comments on this repo's PRs).
    # workflow_dispatch carries no pull_request payload and is always allowed.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job; gh resolves the repo from the remote otherwise.
      GH_REPO: ${{ github.repository }}
      DISPATCH_PR: ${{ inputs.pr }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Upsert round ledger comment
        shell: bash
        run: |
          set -euo pipefail
          PR="${DISPATCH_PR:-$EVENT_PR}"
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::no pull request number resolvable from this event"
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          HEAD="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" || { echo "::error::gh pr view failed"; exit 1; }
          # Same-repo PRs only, enforced in-script too: workflow_dispatch carries
          # no pull_request payload, so the job-level guard cannot see forks.
          head_repo="$(gh api "repos/$OWNER/$REPO/pulls/$PR" --jq .head.repo.full_name 2>/dev/null || true)"
          if [ "$head_repo" != "$GH_REPO" ]; then
            echo "::error::PR #$PR does not come from $GH_REPO (head repo: ${head_repo:-none/deleted fork}); refusing to comment"
            exit 1
          fi

          # Check rollup. `gh pr checks` exits non-zero when any check fails,
          # but still prints valid JSON to stdout; only trust stdout if it
          # parses as an array, otherwise treat the rollup as unavailable.
          checks_json="$(gh pr checks "$PR" --json name,bucket 2>"$work/checks.err" || true)"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$checks_json"; then
            cat "$work/checks.err" >&2
            checks_display="unavailable (request failed; see log)"
            cr_display="unavailable"
          else
            total="$(jq 'length' <<<"$checks_json")"
            passed="$(jq '[.[] | select(.bucket == "pass")] | length' <<<"$checks_json")"
            failed="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks_json")"
            pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks_json")"
            skipping="$(jq '[.[] | select(.bucket == "skipping")] | length' <<<"$checks_json")"
            checks_display="${passed} passed / ${failed} failed / ${pending} pending / ${skipping} skipped (of ${total})"
            cr_display="$(jq -r '[.[] | select(.name | test("(?i)coderabbit"))] | last | .bucket // "not present"' <<<"$checks_json")"
          fi

          # Issue comments. A failed or invalid fetch must abort the refresh:
          # treating it as an empty list would duplicate an existing ledger.
          if ! comments_json="$(gh api "repos/$OWNER/$REPO/issues/$PR/comments" --paginate --slurp 2>"$work/comments.err")"; then
            cat "$work/comments.err" >&2
            echo "::error::could not list issue comments; aborting instead of risking a duplicate ledger"
            exit 1
          fi
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$comments_json"; then
            echo "::error::issue comments response is not a JSON array; aborting instead of risking a duplicate ledger"
            exit 1
          fi

          # Qodo's review is recorded as a pull-request review (GraphQL
          # latestReviews carries the reviewed commit), not as a parseable
          # issue comment; reading it from reviews avoids trusting marker
          # text in comments. No review recorded yet reads as "no review yet".
          qodo_gl_query="$(cat <<'GRAPHQL'
          query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){latestReviews(first:100){nodes{author{login} commit{oid} submittedAt}}}}}
          GRAPHQL
          )"
          qodo_gl=""
          if qodo_gl="$(gh api graphql -f query="$qodo_gl_query" -F owner="$OWNER" -F repo="$REPO" -F pr="$PR" 2>"$work/qodo.err")" && jq -e '.data.repository.pullRequest.latestReviews.nodes | type == "array"' >/dev/null 2>&1 <<<"$qodo_gl"; then
            qodo_node="$(jq -c '[.data.repository.pullRequest.latestReviews.nodes[] | select(.author.login == "qodo-code-review" or .author.login == "qodo-code-review[bot]")] | sort_by(.submittedAt) | last // empty' <<<"$qodo_gl")"
            if [ -n "$qodo_node" ]; then
              qodo_at="$(jq -r .submittedAt <<<"$qodo_node")"
              qodo_sha="$(jq -r .commit.oid <<<"$qodo_node")"
            else
              qodo_at="no review yet"
              qodo_sha="n/a"
            fi
          else
            cat "$work/qodo.err" >&2
            echo "$qodo_gl" >&2
            qodo_at="unavailable (review query failed or malformed response; see log)"
            qodo_sha="n/a"
          fi

          # Unresolved review threads, paginated (reviewThreads only returns
          # one page per request). On failure the ledger reports n/a and the
          # captured error goes to the log; it is never silently hidden.
          graphql_err="$work/graphql.err"
          graphql_query="$(cat <<'GRAPHQL'
          query($owner:String!,$repo:String!,$pr:Int!,$cursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100,after:$cursor){pageInfo{hasNextPage endCursor}nodes{isResolved}}}}}
          GRAPHQL
          )"
          threads_ok=1
          total_threads=0
          unresolved=0
          cursor=""
          while :; do
            args=(-F owner="$OWNER" -F repo="$REPO" -F pr="$PR")
            if [ -n "$cursor" ]; then
              args+=(-F cursor="$cursor")
            fi
            if ! page="$(gh api graphql -f query="$graphql_query" "${args[@]}" 2>"$graphql_err")"; then
              threads_ok=0
              break
            fi
            if ! jq -e '.data.repository.pullRequest.reviewThreads' >/dev/null 2>&1 <<<"$page"; then
              threads_ok=0
              break
            fi
            page_t="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]] | length' <<<"$page")"
            page_u="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$page")"
            total_threads=$((total_threads + page_t))
            unresolved=$((unresolved + page_u))
            has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$page")"
            cursor="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<<"$page")"
            [ "$has_next" = "true" ] || break
          done
          if [ "$threads_ok" -eq 1 ]; then
            threads_note=""
          else
            echo "::warning::threads query failed; thread count reported as n/a:"
            cat "$graphql_err" >&2
            total_threads="n/a"
            unresolved="n/a"
            threads_note=" (threads query failed; see log)"
          fi

          # Build the comment body. The auto markers bracket the machine
          # block; everything below the manual marker is copied over
          # byte-for-byte (via files, not command substitution).
          build_body() {
            local existing="$1" out="$2"
            cat > "$out" <<EOF
          <!-- round-ledger -->
          ## Round ledger

          <!-- round-ledger:auto:start -->
          - head: \`$HEAD\`
          - CI checks: ${checks_display}
          - CodeRabbit check: ${cr_display}
          - Qodo latest review: ${qodo_at} (commit: ${qodo_sha})
          - unresolved review threads: ${unresolved} / ${total_threads}${threads_note}
          - updated by [round-ledger run](${SERVER_URL}/${OWNER}/${REPO}/actions/runs/${RUN_ID}) at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          <!-- round-ledger:auto:end -->

          ### Triage (maintainer/agent-maintained)
          <!-- round-ledger:manual -->
          EOF
            if [ -n "$existing" ] && grep -qF '<!-- round-ledger:manual -->' "$existing"; then
              sed -n '/<!-- round-ledger:manual -->/,$p' "$existing" | tail -n +2 >> "$out"
            else
              printf -- '- _no triage rows yet; the agent/maintainer maintains this section_\n' >> "$out"
            fi
          }

          # The ledger is owned by the workflow bot; a lookalike marker in
          # someone else's comment must never become the PATCH target.
          ledger_id="$(jq -r '[.[][] | select((.body | contains("<!-- round-ledger -->")) and .user.login == "github-actions[bot]")] | first | .id // empty' <<<"$comments_json")"
          existing_body="$work/existing.md"
          : > "$existing_body"
          if [ -n "$ledger_id" ]; then
            jq -r --argjson id "$ledger_id" '.[][] | select(.id == $id) | .body' <<<"$comments_json" > "$existing_body"
          fi

          body_file="$work/body.md"
          build_body "$existing_body" "$body_file"

          echo "ledger: target comment id=${ledger_id:-<none, will create>}"
          if [ -n "$ledger_id" ]; then
            # Re-fetch immediately before patching; if the maintainer edited
            # the comment between our reads, rebuild from the fresh body
            # rather than overwriting their edit.
            if ! gh api "repos/$OWNER/$REPO/issues/comments/$ledger_id" --jq .body > "$work/fresh.md"; then
              echo "::error::could not re-fetch ledger comment $ledger_id; aborting instead of clobbering"
              exit 1
            fi
            if ! cmp -s "$existing_body" "$work/fresh.md"; then
              echo "ledger changed during refresh; rebuilding from fresh read"
              build_body "$work/fresh.md" "$body_file"
            fi
            gh api --method PATCH "repos/$OWNER/$REPO/issues/comments/$ledger_id" -F body=@"$body_file" > /dev/null || { echo "::error::PATCH ledger comment failed"; exit 1; }
            echo "ledger updated (comment $ledger_id)"
          else
            gh api --method POST "repos/$OWNER/$REPO/issues/$PR/comments" -F body=@"$body_file" > /dev/null || { echo "::error::POST ledger comment failed"; exit 1; }
            echo "ledger created on PR #$PR"
          fi
