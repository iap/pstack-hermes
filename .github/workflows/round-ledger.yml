name: round-ledger

# Maintains the bot-owned machine block of the PR "Round ledger" comment
# (docs/agent/review-ops.md). The workflow only rewrites the section between
# <!-- round-ledger:auto:start --> and <!-- round-ledger:auto:end -->; the
# triage rows below <!-- round-ledger:manual --> belong to the maintainer /
# agent and are preserved verbatim across runs.
#
# Triggers: pull_request_target (open/sync/reopen/ready) and manual dispatch.
# The repo default GITHUB_TOKEN is read-only (default_workflow_permissions:
# read), so push/PR-context tokens cannot comment. pull_request_target gives
# the base-repo token write permission — same contract as .github/workflows/
# labeler.yml. No PR code is checked out or executed: every input comes from
# the API, and fork PRs are skipped by the job guard. Bots post issue comments
# rather than reviews, so after bot verdicts land a manual refresh is:
# `gh workflow run round-ledger.yml -f pr=<N>`.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  issues: write        # create/edit the ledger conversation comment
  pull-requests: read  # read PR metadata and review threads
  checks: read         # read the check rollup (Checks API)

concurrency:
  group: round-ledger-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  ledger:
    # Same-repo PRs only (ledger comments on this repo's PRs). workflow_dispatch
    # carries no pull_request payload and is always allowed.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job; gh resolves the repo from the remote otherwise.
      GH_REPO: ${{ github.repository }}
      DISPATCH_PR: ${{ inputs.pr }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Upsert round ledger comment
        shell: bash
        run: |
          set -euo pipefail
          PR="${DISPATCH_PR:-$EVENT_PR}"
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::no pull request number resolvable from this event"
            exit 1
          fi

          HEAD="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          # Check rollup. `gh pr checks` exits non-zero when any check fails,
          # so capture loosely and fall back to an empty rollup.
          checks_json="$(gh pr checks "$PR" --json name,bucket 2>/dev/null || true)"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$checks_json"; then
            checks_json='[]'
          fi
          total="$(jq 'length' <<<"$checks_json")"
          passed="$(jq '[.[] | select(.bucket == "pass")] | length' <<<"$checks_json")"
          failed="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks_json")"
          pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks_json")"
          cr_bucket="$(jq -r '[.[] | select(.name | test("(?i)coderabbit"))] | last | .bucket // "not present"' <<<"$checks_json")"

          # Qodo posts an issue comment, not a review; find the latest one and
          # parse the reviewed commit out of its HTML marker, if present.
          comments_json="$(gh api "repos/$OWNER/$REPO/issues/$PR/comments" --paginate --slurp 2>/dev/null || echo '[[]]')"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$comments_json"; then
            comments_json='[[]]'
          fi
          qodo="$(jq -c '[.[][] | select(.user.login | test("(?i)qodo"))] | last // empty' <<<"$comments_json")"
          if [ -n "$qodo" ]; then
            qodo_at="$(jq -r .created_at <<<"$qodo")"
            qodo_sha="$(jq -r .body <<<"$qodo" | grep -oE 'commit/[0-9a-f]{40}' | tail -n1 | cut -d/ -f2 || true)"
            [ -z "$qodo_sha" ] && qodo_sha="not parsed"
          else
            qodo_at="no review yet"
            qodo_sha="n/a"
          fi

          # Unresolved review threads (the merge gate counts these). The
          # integration token answers 403 for this query, so degrade to n/a
          # rather than failing the job; unresolved threads stay a human check.
          graphql_query="$(cat <<'GRAPHQL'
          query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){nodes{isResolved}}}}}
          GRAPHQL
          )"
          if threads="$(gh api graphql -f query="$graphql_query" -F owner="$OWNER" -F repo="$REPO" -F pr="$PR" 2>/dev/null)"; then
            total_threads="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]] | length' <<<"$threads")"
            unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")"
            threads_note=""
          else
            total_threads="n/a"
            unresolved="n/a"
            threads_note=" (threads API unavailable to this token; count not checked)"
          fi

          # Preserve the manual triage section from an existing ledger comment.
          ledger_id="$(jq -r '[.[][] | select(.body | contains("<!-- round-ledger -->"))] | first | .id // empty' <<<"$comments_json")"
          manual=""
          if [ -n "$ledger_id" ]; then
            manual="$(jq -r --argjson id "$ledger_id" '.[][] | select(.id == $id) | .body' <<<"$comments_json" | sed -n '/<!-- round-ledger:manual -->/,$p' | tail -n +2)"
          fi
          if [ -z "${manual//[[:space:]]/}" ]; then
            manual='- _no triage rows yet; the agent/maintainer maintains this section_'
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- round-ledger -->
          ## Round ledger

          <!-- round-ledger:auto:start -->
          - head: \`$HEAD\`
          - CI checks: ${passed} passed / ${failed} failed / ${pending} pending (of ${total})
          - CodeRabbit check: ${cr_bucket}
          - Qodo latest review: ${qodo_at} (commit: ${qodo_sha})
          - unresolved review threads: ${unresolved} / ${total_threads}${threads_note}
          - updated by [round-ledger run](${SERVER_URL}/${OWNER}/${REPO}/actions/runs/${RUN_ID}) at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          <!-- round-ledger:auto:end -->

          ### Triage (maintainer/agent-maintained)
          <!-- round-ledger:manual -->
          ${manual}
          EOF

          if [ -n "$ledger_id" ]; then
            gh api --method PATCH "repos/$OWNER/$REPO/issues/comments/$ledger_id" -F body=@"$body_file" > /dev/null
            echo "ledger updated (comment $ledger_id)"
          else
            gh api --method POST "repos/$OWNER/$REPO/issues/$PR/comments" -F body=@"$body_file" > /dev/null
            echo "ledger created on PR #$PR"
          fi
