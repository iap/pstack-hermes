name: PR labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

# `pull_request_target` is required for a write token on fork PRs, and is safe
# ONLY while no PR-controlled code is checked out or executed. actions/labeler
# reads .github/labeler.yml from the base and the PR's changed-file list via
# the API - it never runs PR content. If this job ever needs files from the PR
# head, do not add a checkout here: move that work to a `pull_request` workflow.
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Keep labels accurate as the PR evolves: stale labels are removed
          # on synchronize, not just added.
          syncLabels: true
