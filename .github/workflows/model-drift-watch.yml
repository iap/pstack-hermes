# Model-slug drift watch: the panel/config name provider model slugs that
# were verified against the catalog when written. Providers deprecate slugs
# (free tiers especially); this notices and opens/updates ONE tracking
# issue (idempotent by title), so a panel refresh is a deliberate decision
# instead of a broken role surfacing in a live run.

name: model-drift-watch

on:
  schedule:
    - cron: "43 6 * * 1" # weekly, Monday 06:43 UTC
  workflow_dispatch:

# Serialize scheduled and manual runs: two overlapping runs could both see
# "no tracking issue" and create duplicates. Queued (not cancelled) so the
# older run always completes and posts before the newer one decides.
concurrency:
  group: model-drift-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "model panel drift: a configured slug left the provider catalog"

jobs:
  check-slugs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv (pinned interpreter + lockfile)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          enable-cache: true

      - name: Check configured slugs against the live catalog
        shell: bash
        run: |
          set -euo pipefail
          status=0
          uv run --frozen tools/slug_drift.py --prose | tee "$RUNNER_TEMP/drift-findings.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "no drift: every configured slug is in the catalog"
            exit 0
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::slug drift tool failed (catalog unreachable or unparseable)"
            exit 1
          fi

          {
            echo "Configured model slugs missing from the provider catalog:"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/drift-findings.txt"
            echo '```'
            echo ""
            echo "Verify replacements against the catalog, update"
            echo "\`tools/assets/model-panel.json\`, rebuild the package"
            echo "(\`tools/convert.py\` per CONTRIBUTING.md), and re-run the pipeline."
            echo ""
            echo "Prose-only default slugs (backtick-quoted in skill markdown, not in"
            echo "OpenRouter vendor/model format) are listed under PROSE lines above."
            echo "They are informational: update them in the skill files when the"
            echo "provider catalog changes, or leave them as-is if they are still valid."
          } > "$RUNNER_TEMP/drift-body.md"

      - name: Upsert tracking issue (idempotent by title)
        uses: ./.github/actions/drift-issue-upsert
        with:
          title: ${{ env.ISSUE_TITLE }}
          body-file: ${{ runner.temp }}/drift-body.md
