# Bootstrap the labels .github/labeler.yml expects.
# Run from Actions -> "labels-bootstrap" -> Run workflow (or re-run any time
# the palette changes): it is a create-or-update ensure — missing labels are
# created, existing ones are recolored/re-described to match the declared
# palette. Safe to run repeatedly.

name: labels-bootstrap

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create labels (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` needs a repo context; this job has no checkout, so pass it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ensure() {
            local name="$1" color="$2" desc="$3"
            # --limit 1000: gh default is 30, which would hide existing labels
            # past the window and abort the run on `create` under set -e.
            if gh label list --limit 1000 --json name --jq '.[].name' | grep -qxF "$name"; then
              gh label edit "$name" --color "$color" --description "$desc" >/dev/null
              echo "updated: $name"
            else
              gh label create "$name" --color "$color" --description "$desc" >/dev/null
              echo "created: $name"
            fi
          }
          ensure "pstack-core"        "0E8A16" "Core manifest/config changes"
          ensure "skills"             "1D76DB" "Workflow/mode skill changes"
          ensure "principles"         "5319E7" "Principle skill changes"
          ensure "tooling"            "D93F0B" "Converter, validator, CI tooling"
          ensure "documentation"      "0075CA" "Documentation"
          ensure "scanner-clean"      "BFD4F2" "Verified: install-scanner safe verdict"
          ensure "hermes-compat"      "F9D0C4" "Hermes compatibility fix"
          ensure "port"               "E4E669" "Cursor -> hermes port work"
          ensure "bug"                "D73A4A" "Something is broken"
          ensure "enhancement"        "A2EEEF" "New feature or request"
          ensure "os:windows"         "0078D4" "Windows identity: only the Windows agent/app works this issue"
          ensure "os:linux"           "E95420" "Linux identity: only the Linux agent/app works this issue"
          ensure "os:macos"           "6E40C9" "macOS identity: only the macOS agent/app works this issue"
          ensure "assist:windows-confirm" "93C5FD" "Request Windows-agent confirmation on another Windows device"
          ensure "assist:linux-confirm"   "FDBA74" "Request Linux-agent confirmation on another Linux device"
          ensure "assist:macos-confirm"   "C4B5FD" "Request macOS-agent confirmation on another macOS device"
