# Golden-task evals (#194): manual dispatch only, never a per-PR gate.
# Requires a runner with the hermes CLI installed and a configured
# Hermes home (provider credentials). A fresh GitHub-hosted runner has
# neither, so there is deliberately no schedule trigger: weekly runs
# happen on a configured maintainer runner via manual dispatch.
name: evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    # The golden tasks can take 15 minutes; the lifecycle install adds a clone,
    # an install, a remove, a pinned reinstall and an update on top of that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Guard hermes availability
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v hermes >/dev/null 2>&1; then
            echo "::error::hermes CLI not installed on this runner; golden evals need a configured runner (see tools/evals/README.md)"
            exit 1
          fi
          if [ ! -f "$HOME/.hermes/config.yaml" ] && [ -z "${HERMES_HOME:-}" ]; then
            echo "::error::no configured Hermes home found; provider credentials are required"
            exit 1
          fi
          hermes --version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      - name: Run golden-task evals
        run: uv run --frozen python tools/evals/run.py

      # The lifecycle half: the golden tasks prove the method, this proves the
      # artifact users receive installs, removes, re-pins and updates. Same
      # runner requirement (hermes + a configured home), same fail-closed guard.
      - name: Installed-user lifecycle
        run: uv run --frozen python tools/evals/install_smoke.py
