# Golden-task evals (#194): manual dispatch only, never a per-PR gate.
# Requires a runner with the hermes CLI installed and a configured
# Hermes home (provider credentials). A fresh GitHub-hosted runner has
# neither, so there is deliberately no schedule trigger: weekly runs
# happen on a configured maintainer runner via manual dispatch.
name: evals

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated golden case ids (blank = every case, requires reps=1)"
        type: string
        default: poteto-routing
      arm:
        description: "Which arms to run"
        type: choice
        options:
          - both
          - skill
          - baseline
        default: both
      reps:
        description: "Runs per case (3 minimum before calling a delta real)"
        type: number
        default: 3
      timeout:
        description: "Per-case seconds (skill arm needs more than 420s)"
        type: number
        default: 1200
      model:
        description: "Provider model slug (blank = runner default)"
        type: string
        default: ""
      lifecycle:
        description: "Also run the installed-user lifecycle"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    # The golden tasks can take 15 minutes; the lifecycle install adds a clone,
    # an install, a remove, a pinned reinstall and an update on top of that.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Guard hermes availability
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v hermes >/dev/null 2>&1; then
            echo "::error::hermes CLI not installed on this runner; golden evals need a configured runner (see tools/evals/README.md)"
            exit 1
          fi
          if [ ! -f "$HOME/.hermes/config.yaml" ] && [ -z "${HERMES_HOME:-}" ]; then
            echo "::error::no configured Hermes home found; provider credentials are required"
            exit 1
          fi
          hermes --version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      - name: Reject infeasible sweep inputs
        shell: bash
        env:
          TASKS: ${{ inputs.tasks }}
          REPS: ${{ inputs.reps }}
        run: |
          set -euo pipefail
          if [ -z "$TASKS" ] && [ "$REPS" -gt 1 ]; then
            echo "::error::blank tasks with reps>1 exceeds the job budget; name a case or use reps=1"
            exit 1
          fi

      - name: Run golden-task evals
        shell: bash
        env:
          TASKS: ${{ inputs.tasks }}
          ARM: ${{ inputs.arm }}
          REPS: ${{ inputs.reps }}
          TIMEOUT: ${{ inputs.timeout }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          args=(--arm "$ARM" --reps "$REPS" --timeout "$TIMEOUT" --json-out "$RUNNER_TEMP/sweep.json")
          if [ -n "$TASKS" ]; then
            args+=(--tasks "$TASKS")
          fi
          if [ -n "$MODEL" ]; then
            args+=(--model "$MODEL")
          fi
          uv run --frozen python tools/evals/run.py "${args[@]}"

      - name: Publish sweep summary
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/sweep.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          src, out = Path(sys.argv[1]), Path(sys.argv[2])
          if not src.is_file():
              with out.open("a", encoding="utf-8") as fh:
                  fh.write("evals: no sweep record to summarize\n")
              raise SystemExit(0)
          data = json.loads(src.read_text(encoding="utf-8"))

          def rate(cell):
              scored = cell["total"] - cell["error"]
              return cell["pass"] / scored * 100 if scored else None

          lines = ["| case | skill | baseline | delta |", "|---|---|---|---|"]
          for row in data.get("summary", []):
              def cell(arm):
                  c = row.get(arm, {"pass": 0, "total": 0, "error": 0})
                  return f"{c['pass']}/{c['total']}" + (f" ({c['error']} error)" if c["error"] else "")
              skill, base = row.get("skill", {}), row.get("baseline", {})
              s, b = rate(skill), rate(base)
              delta = f"{s - b:+.0f}pp" if s is not None and b is not None else "n/a"
              lines.append(f"| {row['case']} | {cell('skill')} | {cell('baseline')} | {delta} |")
          with out.open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload sweep record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evals-sweep
          path: ${{ runner.temp }}/sweep.json
          if-no-files-found: warn

      - name: Installed-user lifecycle
        if: ${{ inputs.lifecycle }}
        run: uv run --frozen python tools/evals/install_smoke.py
