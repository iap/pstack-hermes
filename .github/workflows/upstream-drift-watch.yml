# Upstream drift watch: cursor/plugins moves on, the package is built from a
# pinned commit. This workflow notices when upstream pstack/ changes past the
# pin and opens/updates ONE tracking issue (idempotent by title), so a pin
# bump is a deliberate decision instead of a surprise.

name: upstream-drift-watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:

concurrency:
  group: upstream-drift-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_PIN: c47b12849e43f18d5c374c7069c744cc55b0ea00
  ISSUE_TITLE: "upstream pstack drift: cursor/plugins moved past the pinned SHA"

jobs:
  check-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh issue list/comment/create` are called below WITHOUT --repo, so gh
      # resolves the target repository from the git checkout. Without this step
      # there is no repository in the workspace and gh fails with
      # "failed to run git: fatal: not a git repository" - the failure this job
      # hit on every run since 2026-09-14, masked by the clone guard.
      # persist-credentials: false because nothing here pushes; GH_TOKEN is
      # supplied explicitly for the API calls. Matches model-drift-watch.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check upstream pstack for movement past the pin
        id: check
        run: |
          set -euo pipefail
          upstream_url="https://github.com/cursor/plugins.git"
          head="$(git ls-remote "$upstream_url" HEAD | cut -f1)"
          echo "upstream HEAD: $head"
          if [ "$head" = "$UPSTREAM_PIN" ]; then
            echo "no drift: upstream HEAD still at the pin"
            exit 0
          fi

          usable() {
            [ -d "$RUNNER_TEMP/upstream/.git" ] \
              && git -C "$RUNNER_TEMP/upstream" rev-parse --git-dir >/dev/null 2>&1
          }

          # Plain shallow clone, no partial-clone filter. A blobless
          # --filter=blob:none clone creates a promisor repo whose trees are
          # fetched on demand, which needs network at diff time and has proven
          # fragile on hosted runners. This job only needs two commits of
          # pstack/, so the filter bought nothing worth that fragility.
          rm -rf "$RUNNER_TEMP/upstream"
          if ! clone_log="$(git clone --no-checkout --depth 1 \
              "$upstream_url" "$RUNNER_TEMP/upstream" 2>&1)" \
              || ! usable; then
            echo "::error::could not clone $upstream_url: ${clone_log:-unknown error}"
            exit 1
          fi
          git -C "$RUNNER_TEMP/upstream" fetch --depth 1 origin "$UPSTREAM_PIN" "$head"
          # The diff needs the pinned tree. Capture its exit status instead of
          # using it only as a condition: 0 and 1 are real answers (identical /
          # differs), anything above 1 is a failure and is reported as one.
          diff_status=0
          git -C "$RUNNER_TEMP/upstream" diff --quiet "$UPSTREAM_PIN" "$head" -- pstack || diff_status=$?
          if [ "$diff_status" -gt 1 ]; then
            echo "::error::could not diff $UPSTREAM_PIN..$head for pstack/ (git exit $diff_status)"
            exit 1
          fi
          if [ "$diff_status" -eq 0 ]; then
            echo "upstream moved ($UPSTREAM_PIN -> $head) but pstack/ is unchanged"
            exit 0
          fi

          {
            echo "Upstream HEAD is now \`$head\` (pin: \`$UPSTREAM_PIN\`)."
            echo ""
            echo "### Changed files (pstack/)"
            echo '```'
            git -C "$RUNNER_TEMP/upstream" diff --stat "$UPSTREAM_PIN" "$head" -- pstack
            echo '```'
            echo ""
            echo "Rebuild against the new upstream, update the transform maps for any"
            echo "reworded anchors (the converter's anchor audit will name them), bump"
            echo "UPSTREAM_PIN in all three workflows (ci.yml / release.yml /"
            echo "upstream-drift-watch.yml - tools/check_pins.py"
            echo "enforces lock-step), and re-run the pipeline."
          } > "$RUNNER_TEMP/drift-body.md"
          # Guard for the next step: split across steps, the no-drift `exit 0`s
          # above stop this script but not the job - only a body write may upsert.
          echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Upsert tracking issue (idempotent by title)
        if: steps.check.outputs.drift == 'true'
        uses: ./.github/actions/drift-issue-upsert
        with:
          title: ${{ env.ISSUE_TITLE }}
          body-file: ${{ runner.temp }}/drift-body.md
