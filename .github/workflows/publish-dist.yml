# Publish: append the built package to the `dist` branch of THIS repository.
#
# `dist` is the install source and is set as the repository's DEFAULT branch,
# so `hermes plugins install iap/pstack-hermes` clones exactly this tree
# (plugin.json at root) and `hermes plugins update pstack` is a fast-forward
# `git pull` on the installed clone. There is no second repository.
#
# Publishes are APPEND-ONLY commits on top of `dist` - never a history rewrite
# (update = git pull --ff-only on every install, so a rewritten remote would
# break every user's in-place update).
#
# The dev tree (tools/, .github, docs) stays on `master`; only the validated
# `pstack/` output is synced onto `dist`. This publisher NEVER touches
# `dist/.github/`: bot tokens cannot push workflow files, so the
# default-branch shims that cannot live on a non-default branch were
# bootstrapped once with a user credential and are left alone - the scheduler
# stub (.github/workflows/scheduler.yml - it dispatches the weekly drift
# watchers on `master`, because GitHub fires `schedule` only from the default
# branch), the labeler workflow, and the dependabot config. Re-bootstrap
# sources are listed in CONTRIBUTING.
#
# Manual recovery: the Actions UI lists workflows from the default branch
# only, so this file's 'Run workflow' button is not shown there - trigger it
# against `master` from the CLI instead (verified working):
#   gh workflow run publish-dist.yml --ref master

name: publish-dist

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_PIN: c47b12849e43f18d5c374c7069c744cc55b0ea00

concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Shared build prologue - same action ci.yml and release.yml use, so the
      # published tree can never be built by a divergent copy of the steps.
      - name: Build package from pin
        uses: ./.github/actions/build-package
        with:
          upstream-pin: ${{ env.UPSTREAM_PIN }}

      - name: Sync dist branch (same repo, append-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authed_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          dist="$RUNNER_TEMP/dist"
          git clone -q --branch dist "$authed_url" "$dist"
          # Scrub the token from the clone's remote config; pushes pass the URL
          # explicitly so it is never persisted.
          git -C "$dist" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          # Replace the tree with the fresh build (.git kept): an append-only
          # commit on top of dist so installed clones can fast-forward.
          find "$dist" -mindepth 1 -maxdepth 1 -not -name ".git" -not -name ".github" -exec rm -rf {} +
          cp -a pstack/. "$dist/"
          # The dist branch is consumed by `hermes plugins install` (a git
          # clone), so it needs its own .gitattributes. The package contract is
          # LF-only (tools/validate.py fails on any CRLF), but without this a
          # consumer on Windows - where core.autocrlf=true is common - checks
          # the package out as CRLF and then `hermes plugins update`'s
          # stash/pull/reapply silently rewrites their customized
          # config/models.json. The rule lives in tools/assets/dist.gitattributes
          # so this publisher and tools/dist_checkout_check.py cannot drift.
          cp -a tools/assets/dist.gitattributes "$dist/.gitattributes"
          # dist/.github/ is preserved untouched (see the header): the stub
          # is bootstrapped once; bots cannot push workflow files.
          git -C "$dist" add -A

          # Gate on the tree we are about to publish, as a consumer receives it.
          if ! uv run --frozen tools/dist_checkout_check.py --package "$dist"; then
            echo "::error::staged dist tree fails the consumer checkout check - refusing to publish"
            exit 1
          fi
          if git -C "$dist" diff --cached --quiet; then
            echo "dist tree unchanged - nothing to publish"
            exit 0
          fi

          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # One line: pin + run URL. Everything else (converter hash, timestamp)
          # is already in .build-provenance.txt inside the tree.
          git -C "$dist" commit -q \
            -m "publish: pstack from pin ${UPSTREAM_PIN:0:7} (run ${GITHUB_RUN_ID})"

          git -C "$dist" push -q "$authed_url" dist:dist
          echo "published ${GITHUB_REPOSITORY}@dist $(git -C "$dist" rev-parse --short HEAD)"
