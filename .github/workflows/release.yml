# Release: create a GitHub Release with packaged plugin assets.
#
# Manually dispatched from master with the release tag as input. A v* tag-push
# trigger would run the workflow definition from the pushed tag's tree, letting
# a tag pusher rewrite this gate itself while keeping contents: write. Dispatch
# from master runs the gate from master (trusted code, master-resident signer
# list) and only fetches, verifies, and then checks out the tagged commit.
#
# Produces:
#   - pstack-<version>.zip — portable plugin package
#   - Release body from CHANGELOG section for that version
#
# The tag MUST be signed by an allowed signer — SSH ed25519 verified
# against keys/allowed_signers from the master ref first; OpenPGP keys
# registered on the repo owner's GitHub profile (fetched live; no key
# material committed) as fallback — or the release fails closed before
# any packaging runs.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  UPSTREAM_PIN: c47b12849e43f18d5c374c7069c744cc55b0ea00

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
          # Full clone: the gate must be able to traverse master's complete
          # history to prove that an older signed tag's commit is an ancestor
          # of master (a depth-one checkout cannot).
          fetch-depth: 0

# The tag is the trust root of the release: everything downstream
# (pin check, build, publish) attests to whatever ref was dispatched.
# Fail closed if it was not signed by an allowed signer. SSH ed25519 is
# the primary format; the trusted signer list comes from master —
# never from the tag's tree, which a tag pusher controls. As the
# fallback, OpenPGP keys registered on the repo owner's GitHub profile
# are fetched live — no key material is committed to this repository.
# The pinned tag must point at a commit that is an ancestor of master
# before any tag-controlled code executes; the workspace then switches
# to exactly that commit for building and publishing.
      - name: "Release gate: verify tag from master (SSH ed25519, OpenPGP fallback)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$TAG_NAME"
          # Explicit destination for the tag ref: a source-only refspec can be
          # present only in FETCH_HEAD (no local refs/tags/$TAG) for tags
          # outside the checkout's auto-follow depth.
          git fetch origin "refs/heads/master:refs/remotes/origin/master" "refs/tags/$TAG:refs/tags/$TAG"
          tag_obj="$(git rev-parse "refs/tags/$TAG")"
          peeled="$(git rev-parse "refs/tags/$TAG^{}")"
          # The signature attests to the tag object's embedded name; a
          # re-pointed copy of a signed tag under a new name must fail.
          # Line 3 of `git cat-file tag` is the `tag <name>` header; consuming
          # the full output (no head) keeps a long tag message from killing
          # the pipe under pipefail before verification.
          signed_name="$(git cat-file tag "$tag_obj" | sed -n '3s/^tag //p')"
          if [ -z "$signed_name" ] || [ "$signed_name" != "$TAG" ]; then
            echo "::error::signed tag name '$signed_name' does not match dispatched tag '$TAG'; refusing to verify" >&2
            exit 1
          fi
          # Pin the exact tag object for the whole run; the "Confirm the tag
          # object did not move" step before publishing re-checks it.
          echo "TAG_OBJ_SHA=$tag_obj" >> "$GITHUB_ENV"
          echo "PEELED_SHA=$peeled" >> "$GITHUB_ENV"
          # Only commits reachable from master may be released, checked
          # before any tag-controlled code executes.
          if ! git merge-base --is-ancestor "$peeled" origin/master; then
            echo "::error::tag source $peeled is not an ancestor of master; refusing to release" >&2
            exit 1
          fi
          # The trusted signer list comes from master, never from the
          # tag's tree.
          git show origin/master:keys/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          echo "verifying $TAG against master:keys/allowed_signers (SSH ed25519)"
          # Verify the pinned object itself, never the (possibly hostile) tag
          # name input or another same-named ref.
          if git -c gpg.format=ssh -c "gpg.ssh.allowedSignersFile=$RUNNER_TEMP/allowed_signers" verify-tag "$tag_obj" 2>"$RUNNER_TEMP/tag-ssh.err"; then
            echo "tag signature OK (SSH)"
            exit 0
          fi
          echo "SSH verification failed:"
          cat "$RUNNER_TEMP/tag-ssh.err"
          echo "trying OpenPGP fallback against keys registered on GitHub for $GITHUB_REPOSITORY_OWNER"
          mkdir -p "$RUNNER_TEMP/openpgp-keys"
          gh api "users/${GITHUB_REPOSITORY_OWNER}/gpg_keys" --paginate --jq '.[].raw_key' > "$RUNNER_TEMP/openpgp-keys/all.asc"
          if [ -s "$RUNNER_TEMP/openpgp-keys/all.asc" ]; then
            # Import each armored block separately; one malformed entry
            # must not poison the rest.
            awk -v dir="$RUNNER_TEMP/openpgp-keys" 'BEGIN{n=0} /^-----BEGIN/ {n++} {print > (dir "/" n ".asc")}' "$RUNNER_TEMP/openpgp-keys/all.asc"
            for f in "$RUNNER_TEMP/openpgp-keys"/*.asc; do
              gpg --batch --import "$f" && echo "imported $f" || echo "::warning::skip malformed key block $f"
            done
          fi
          if git -c gpg.format=openpgp verify-tag "$tag_obj" 2>"$RUNNER_TEMP/tag-gpg.err"; then
            echo "tag signature OK (OpenPGP)"
            exit 0
          fi
          echo "::error::release tag $TAG is not signed by an allowed signer"
          cat "$RUNNER_TEMP/tag-gpg.err" >&2
          exit 1

      # The master-side gate passed: the tag's object is pinned and its peeled
      # commit is on master. The workspace now switches to exactly that commit
      # for building and publishing; tag-controlled content only ever runs after
      # master-side verification.
      - name: Check out the verified tag commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -f "$PEELED_SHA"

      # release.yml previously carried its own copy of the build prologue AND was
      # missing the "Verify pinned SHA" step that ci.yml
      # had, so a release could be cut from a pin that silently failed to
      # resolve. The shared action gives every caller the verified-pin behaviour.
      - name: Build package from pin
        uses: ./.github/actions/build-package
        with:
          upstream-pin: ${{ env.UPSTREAM_PIN }}

      - name: Verify release source and published package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master dist
          source_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source_sha" origin/master
          package_sha="$(git rev-parse origin/dist)"
          published="$RUNNER_TEMP/release-dist"
          mkdir -p "$published"
          git archive "$package_sha" | tar -x -C "$published"
          # Ignore dist-only compatibility metadata when comparing the package.
          rm -rf "$published/.github" "$published/.gitattributes"
          # The timestamp is volatile; all other provenance fields must match.
          test -f "$published/.build-provenance.txt"
          test -f .build-provenance.txt
          grep -q '^converted_at: ' "$published/.build-provenance.txt"
          grep -q '^converted_at: ' .build-provenance.txt
          sed '/^converted_at: /d' "$published/.build-provenance.txt" > "$RUNNER_TEMP/dist-provenance"
          sed '/^converted_at: /d' .build-provenance.txt > "$RUNNER_TEMP/build-provenance"
          diff -u "$RUNNER_TEMP/dist-provenance" "$RUNNER_TEMP/build-provenance"
          rm -f "$published/.build-provenance.txt"
          mkdir -p "$RUNNER_TEMP/release-built"
          cp -a plugin.json skills config README.md LICENSE .build-provenance.txt "$RUNNER_TEMP/release-built"
          if [ -d assets ]; then cp -a assets "$RUNNER_TEMP/release-built/"; fi
          rm -f "$RUNNER_TEMP/release-built/.build-provenance.txt"
          diff -qr "$RUNNER_TEMP/release-built" "$published"
          echo "PACKAGE_SHA=$package_sha" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Package plugin
        run: |
          if [ -d assets ]; then zip -r pstack-"${TAG_NAME}".zip plugin.json skills/ config/ assets/ README.md LICENSE .build-provenance.txt; else zip -r pstack-"${TAG_NAME}".zip plugin.json skills/ config/ README.md LICENSE .build-provenance.txt; fi
          sha256sum pstack-"${TAG_NAME}".zip > SHA256SUMS
        env:
          TAG_NAME: ${{ inputs.tag }}

      - name: Extract release notes
        run: |
          # Strip leading 'v' from tag to match CHANGELOG version format
          VERSION="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v ver="[$VERSION]" '
            /^## / { if (seen) exit; if (index($0, ver)) seen=1; next }
            seen { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            echo "## $VERSION" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> RELEASE_NOTES.md
          fi
          {
            echo ""
            echo "## Verified package"
            echo "Source commit: $SOURCE_SHA"
            echo "Package commit: $PACKAGE_SHA"
            echo '```sh'
            echo "hermes plugins install ${GITHUB_REPOSITORY} --ref $PACKAGE_SHA --enable"
            echo '```'
            echo "To move an existing pinned install to this release:"
            echo '```sh'
            echo "hermes plugins install ${GITHUB_REPOSITORY} --ref $PACKAGE_SHA --force --enable"
            echo '```'
            echo "Unpinned installs: hermes plugins update pstack"
            echo "Verify the ZIP with: sha256sum --check SHA256SUMS"
          } >> RELEASE_NOTES.md
        env:
          TAG_NAME: ${{ inputs.tag }}

      - name: Confirm the tag object did not move before publishing
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG_NAME"
          # FETCH_HEAD is what the remote currently advertises for the tag
          # name (the local tag ref is never clobbered without --force).
          current="$(git rev-parse FETCH_HEAD)"
          if [ "$current" != "$TAG_OBJ_SHA" ]; then
            echo "::error::tag $TAG_NAME moved during the run (was $TAG_OBJ_SHA, now $current); refusing to publish" >&2
            exit 1
          fi
          echo "tag object pinned: $current"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            pstack-"$TAG_NAME".zip SHA256SUMS \
            --title "pstack $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
