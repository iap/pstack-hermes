# Release: create a GitHub Release with packaged plugin assets
# Triggered on version tags (v*).
#
# Produces:
#   - pstack-<version>.zip — portable plugin package
#   - Release body from CHANGELOG section for that version

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UPSTREAM_PIN: c47b12849e43f18d5c374c7069c744cc55b0ea00

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # release.yml previously carried its own copy of the build prologue AND was
      # missing the "Verify pinned SHA" step that ci.yml and publish-plugin.yml
      # had, so a release could be cut from a pin that silently failed to
      # resolve. The shared action gives every caller the verified-pin behaviour.
      - name: Build package from pin
        uses: ./.github/actions/build-package
        with:
          upstream-pin: ${{ env.UPSTREAM_PIN }}

      - name: Package plugin
        run: |
          zip -r pstack-"${TAG_NAME}".zip pstack/
          echo "packaged: $(ls -lh pstack-"${TAG_NAME}".zip)"
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Extract release notes
        run: |
          # Strip leading 'v' from tag to match CHANGELOG version format
          VERSION="${TAG_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v ver="[$VERSION]" '
            /^## / { if (seen) exit; if (index($0, ver)) seen=1; next }
            seen { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            echo "## $VERSION" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            pstack-"$TAG_NAME".zip \
            --title "pstack-hermes $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
