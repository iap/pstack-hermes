name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  convert-and-validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same epoch on both legs -> cross-platform byte-determinism is provable.
      # HEAD commit time: identical on every runner for a given event.
      - name: Record HEAD commit time as SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up uv (pinned interpreter + lockfile)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Clone upstream pstack at the pinned commit
        shell: bash
        run: |
          git clone --depth 1 https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor-plugins"
          git -C "$RUNNER_TEMP/cursor-plugins" fetch --depth 1 origin 799151d91b6e12ee7dbd09f708eec108d7de9b3b
          git -C "$RUNNER_TEMP/cursor-plugins" checkout 799151d91b6e12ee7dbd09f708eec108d7de9b3b

      - name: Verify pinned upstream SHA (re-check)
        shell: bash
        run: |
          got="$(git -C "$RUNNER_TEMP/cursor-plugins" rev-parse HEAD)"
          want="799151d91b6e12ee7dbd09f708eec108d7de9b3b"
          if [ "$got" != "$want" ]; then
            echo "::error::pinned SHA mismatch: got $got, want $want"
            exit 1
          fi
          echo "pinned upstream SHA verified: $got"

      - name: Convert (apply all transforms)
        shell: bash
        run: |
          uv run --frozen tools/convert.py \
            --source "$RUNNER_TEMP/cursor-plugins/pstack" \
            --out "$GITHUB_WORKSPACE/pstack"

      - name: Verify provenance consistency (source_commit == pinned SHA)
        shell: bash
        run: |
          pin="799151d91b6e12ee7dbd09f708eec108d7de9b3b"
          if [ ! -f pstack/.build-provenance.txt ]; then
            echo "::error::.build-provenance.txt missing from the converted package"
            exit 1
          fi
          if ! grep -q "source_commit: $pin" pstack/.build-provenance.txt; then
            echo "::error::provenance source_commit does not match the pinned upstream SHA"
            exit 1
          fi
          echo "provenance consistency verified: source_commit == $pin"

      - name: Validate (static + repo YAML + structural checks)
        shell: bash
        run: |
          uv run --frozen tools/validate.py --package "$GITHUB_WORKSPACE/pstack"

      - name: Scanner gate (community source must be safe)
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          # hermes-side check runs on the maintainer machine; in CI we assert the
          # scanner-clean invariants statically instead. Two ban classes:
          #   security bans  -> package-wide (no exceptions)
          #   delegation vocab (Cursor API names) -> hermes-facing surface only;
          #      the Cursor dual-load surface (agents/, .cursor-plugin/) and the
          #      build provenance (which documents the fixes by name) are exempt.
          import pathlib
          pkg = pathlib.Path("pstack")
          text_files = [p for p in pkg.rglob("*")
                        if p.is_file() and p.suffix in {".md", ".json", ".txt"}]
          security_bans = ["tailscale.com/install.sh", "FOR_AGENTS.md",
                           "http://127.0.0.1:4173"]
          vocab_bans = ["subagent_type", "generalPurpose"]
          exempt = ("agents/", ".cursor-plugin/", ".build-provenance.txt")
          bad = []
          for p in text_files:
              rel = p.relative_to(pkg).as_posix()
              t = p.read_text(encoding="utf-8", errors="replace")
              for b in security_bans:
                  if b in t:
                      bad.append(f"{rel}: {b} (security, package-wide)")
              if not rel.startswith(exempt):
                  for b in vocab_bans:
                      if b in t:
                          bad.append(f"{rel}: {b} (delegation vocab, hermes-facing)")
          assert not bad, f"banned constructs present: {bad}"
          print(f"scanner-clean invariants: OK ({len(text_files)} text files scanned)")
          PY

      - name: Upload converted package (per-OS, consumed by verify-determinism)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pstack-hermes-${{ matrix.os }}-${{ github.sha }}
          path: pstack/
          include-hidden-files: true

  # Anti-hand-edit / anti-drift gate: the committed pstack/ must be exactly
  # what the converter produces from the pinned upstream (provenance excluded,
  # whose source field is a runner-local path by design).
  verify-committed-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record HEAD commit time as SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up uv (pinned interpreter + lockfile)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Clone upstream pstack at the pinned commit
        shell: bash
        run: |
          git clone --depth 1 https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor-plugins"
          git -C "$RUNNER_TEMP/cursor-plugins" fetch --depth 1 origin 799151d91b6e12ee7dbd09f708eec108d7de9b3b
          git -C "$RUNNER_TEMP/cursor-plugins" checkout 799151d91b6e12ee7dbd09f708eec108d7de9b3b

      - name: Rebuild the package to a scratch dir (never touch the checkout)
        shell: bash
        run: |
          uv run --frozen tools/convert.py \
            --source "$RUNNER_TEMP/cursor-plugins/pstack" \
            --out "$RUNNER_TEMP/pstack-rebuilt"

      - name: Compare committed package vs fresh rebuild (excluding provenance)
        shell: bash
        run: |
          set -euo pipefail
          tree_hash() {
            ( cd "$1" && find . -type f ! -name ".build-provenance.txt" -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          committed="$(tree_hash "$GITHUB_WORKSPACE/pstack")"
          rebuilt="$(tree_hash "$RUNNER_TEMP/pstack-rebuilt")"
          echo "committed: $committed"
          echo "rebuilt:   $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::committed pstack/ drifts from a fresh pipeline build - hand-edits or stale package"
            diff -r --exclude=.build-provenance.txt "$GITHUB_WORKSPACE/pstack" "$RUNNER_TEMP/pstack-rebuilt" || true
            exit 1
          fi
          echo "committed package freshness: OK (byte-identical to a fresh pipeline build)"

  # The real payoff of the matrix: prove the converter is byte-deterministic
  # across platforms (LF discipline, no BOM, no path leakage) — not just that
  # each platform passes in isolation.
  verify-determinism:
    runs-on: ubuntu-latest
    needs: convert-and-validate
    steps:
      - name: Download both platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pstack-hermes-*-${{ github.sha }}
          merge-multiple: false
          path: artifacts

      - name: Compare builds byte-for-byte (excluding per-build provenance)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t legs < <(find artifacts -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#legs[@]}" -ne 2 ]; then
            echo "::error::expected 2 platform artifacts, got ${#legs[@]}"
            exit 1
          fi
          tree_hash() {
            ( cd "$1" && find . -type f ! -name ".build-provenance.txt" -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          h1="$(tree_hash "${legs[0]}")"
          h2="$(tree_hash "${legs[1]}")"
          echo "tree A: $h1"
          echo "tree B: $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::platform builds diverge - the converter is NOT byte-deterministic across OS"
            diff <(cd "${legs[0]}" && find . -type f ! -name ".build-provenance.txt" | sort) \
                 <(cd "${legs[1]}" && find . -type f ! -name ".build-provenance.txt" | sort) || true
            exit 1
          fi
          p1="$(find "${legs[0]}" -name ".build-provenance.txt" -exec grep -h '^source_commit:' {} \; | head -n1)"
          p2="$(find "${legs[1]}" -name ".build-provenance.txt" -exec grep -h '^source_commit:' {} \; | head -n1)"
          if [ -z "$p1" ] || [ -z "$p2" ]; then
            echo "::error::provenance not found in one of the artifacts"
            exit 1
          fi
          if [ "$p1" != "$p2" ]; then
            echo "::error::provenance source_commit differs between platforms"
            exit 1
          fi
          echo "cross-platform determinism: OK (byte-identical, excluding per-build provenance metadata)"
