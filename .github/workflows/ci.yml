name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on PRs only. A push to master must keep its full run: its
# artifacts feed verify-determinism, and a cancelled build would skip the
# cross-platform comparison entirely. cancel-in-progress protects only runs that
# have already started; by default only ONE run may be pending per group and a
# newer pending run cancels the older pending one, so two quick merges could
# cancel a queued master run before it ever starts. Non-PR runs therefore take a
# per-run group and never share a queue slot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Shared build prologue (validate + scanner gate on the checked-out tree).
      - name: Build package
        id: build
        uses: ./.github/actions/build-package

      # Consumer-side regression check (see tools/dist_checkout_check.py). The build
      # job above validates the source package on disk, where files are LF
      # as committed. Nothing here constructs a git
      # checkout of the dist tree, so a line-ending or binary-asset regression in the
      # published artifacts would ship uncaught. This stages the package exactly as an
      # install clone of the dist branch receives it (core.autocrlf=true).
      - name: Dist checkout is LF-only under autocrlf
        shell: bash
        run: uv run --frozen tools/dist_checkout_check.py --package . --source-tree

      # A build must never modify tracked files; if one changes, the tree
      # is not clean and the gate above is suspect. A leftover
      # pstack.tmp-build / pstack.prev-build scratch dir still fails here.
      - name: Assert no tracked file changed by the build
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain -- .)"
          if [ -n "$dirty" ]; then
            echo "::error::the build modified tracked files"
            echo "$dirty"
            exit 1
          fi
          echo "no unexpected tracked changes: OK"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pstack-build-${{ matrix.os }}-${{ github.run_id }}
          path: |
            plugin.json
            README.md
            LICENSE
            skills/
            config/
            assets/
            package.json
            bun.lock
            scripts/
          include-hidden-files: true
          # Short retention: verify-determinism consumes these within minutes;
          # the artifact is a debugging aid, not a release artifact.
          retention-days: 14

  verify-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pstack-build-*-${{ github.run_id }}
          merge-multiple: false
          path: artifacts

      - name: Compare builds byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t legs < <(find artifacts -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#legs[@]}" -ne 2 ]; then
            echo "::error::expected 2 artifacts, got ${#legs[@]}"
            exit 1
          fi
          tree_hash() {
            ( cd "$1" && find . -type f -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          h1="$(tree_hash "${legs[0]}")"
          h2="$(tree_hash "${legs[1]}")"
          echo "tree A: $h1"
          echo "tree B: $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::platform builds diverge - checked-out package is NOT byte-identical across OSes"
            diff <(cd "${legs[0]}" && find . -type f | sort) \
                 <(cd "${legs[1]}" && find . -type f | sort) || true
            exit 1
          fi
          echo "cross-platform determinism: OK"

  lint-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      # Cheapest first: a grep over four files, then the workflow linter,
      # then the composite-action shell gate (actionlint does not descend
      # into .github/actions - see tools/check_action_shell.py).
      - name: Hermes pin is in lock-step across workflows
        run: uv run --frozen python tools/check_pins.py

      - name: Dependabot config is valid
        run: uv run --frozen python tools/check_dependabot.py

      # Docs carry the contract agents follow; they drifted once during the
      # root-layout migration. Cheap grep-style gate (see tools/check_docs.py).
      - name: Hand-written docs match the package layout
        run: uv run --frozen python tools/check_docs.py

      - name: Lint workflows (actionlint + shellcheck)
        run: uv run --frozen actionlint

      - name: Lint composite-action shell blocks (shellcheck)
        run: uv run --frozen python tools/check_action_shell.py

      # Needs network: reads each pinned action's action.yml from
      # raw.githubusercontent.com. The runner only WARNS on an undeclared
      # `with:` key and silently ignores it (how `syncLabels` vs `sync-labels`
      # shipped), so this is the gate for that class. actionlint cannot cover
      # it: it exits 0 on the exact defect (verified by reintroducing it).
      - name: 'Lint action inputs (undeclared with: keys)'
        run: uv run --frozen python tools/check_action_inputs.py

      - name: Lint (ruff)
        run: uv run --frozen ruff check tools

      - name: Unit tests (pytest)
        run: uv run --frozen pytest -q

  poteto-mode-scripts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (poteto-mode scripts)
        run: bun test scripts/orch scripts/watch-pr

      - name: Typecheck (poteto-mode scripts)
        run: bunx tsc --project scripts/watch-pr/tsconfig.json --noEmit --strict

  pr-checklist:
    # Advisory: reports whether the PR's machine-checkable claims hold. It never
    # blocks a merge - the `build` job is the enforcing gate. Scoped to
    # pull_request only; a push has no PR body to read.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          enable-cache: true

      - name: Check PR description against the tree it proposes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          rc=0
          uv run --frozen python tools/pr_checklist.py "$RUNNER_TEMP/pr-body.md" || rc=$?
          echo "pr-checklist exit: $rc (0 = consistent, 1 = contradiction)"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::pr-checklist found a contradiction. This job is ADVISORY - it reports, it does not block. The enforcing gate is the build job."
          fi
          exit 0
