name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UPSTREAM_PIN: 93b00b89ef425a9c1bac0d0b317dfc49c930ac99

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          enable-cache: true

      - name: Cache upstream clone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cursor-plugins
          key: upstream-${{ env.UPSTREAM_PIN }}-${{ runner.os }}-${{ hashFiles('tools/convert.py') }}
          restore-keys: |
            upstream-${{ env.UPSTREAM_PIN }}-${{ runner.os }}-

      - name: Clone upstream pstack at pin
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/cursor-plugins/.git" ]; then
            echo "using cached upstream clone"
            git -C "$RUNNER_TEMP/cursor-plugins" fetch --depth 1 origin "$UPSTREAM_PIN"
          else
            git clone --depth 1 https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor-plugins"
          fi
          git -C "$RUNNER_TEMP/cursor-plugins" checkout -q "$UPSTREAM_PIN"

      - name: Verify pinned SHA
        shell: bash
        run: |
          got="$(git -C "$RUNNER_TEMP/cursor-plugins" rev-parse HEAD)"
          if [ "$got" != "$UPSTREAM_PIN" ]; then
            echo "::error::SHA mismatch: got $got, want $UPSTREAM_PIN"
            exit 1
          fi
          echo "pinned upstream SHA verified: $got"

      - name: Convert
        shell: bash
        run: uv run --frozen tools/convert.py --source "$RUNNER_TEMP/cursor-plugins/pstack" --out pstack

      - name: Validate
        shell: bash
        run: uv run --frozen tools/validate.py --package pstack

      - name: Scanner gate
        shell: bash
        run: uv run --frozen tools/scanner_gate.py --package pstack

      - name: Verify reproducible build
        shell: bash
        run: |
          set -euo pipefail
          tree_hash() {
            ( cd "$1" && find . -type f ! -name ".build-provenance.txt" -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          committed="$(tree_hash "$GITHUB_WORKSPACE/pstack")"
          rebuilt="$(tree_hash pstack)"
          echo "committed: $committed"
          echo "rebuilt:   $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::committed pstack/ drifts from a fresh build - hand-edits or stale package"
            diff -r --exclude=.build-provenance.txt "$GITHUB_WORKSPACE/pstack" pstack || true
            exit 1
          fi
          echo "reproducible build: OK (byte-identical to fresh rebuild)"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pstack-build-${{ matrix.os }}-${{ github.run_id }}
          path: pstack/
          include-hidden-files: true

  verify-determinism:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pstack-build-*-${{ github.run_id }}
          merge-multiple: false
          path: artifacts

      - name: Compare builds byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t legs < <(find artifacts -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#legs[@]}" -ne 2 ]; then
            echo "::error::expected 2 artifacts, got ${#legs[@]}"
            exit 1
          fi
          tree_hash() {
            ( cd "$1" && find . -type f ! -name ".build-provenance.txt" -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 )
          }
          h1="$(tree_hash "${legs[0]}")"
          h2="$(tree_hash "${legs[1]}")"
          echo "tree A: $h1"
          echo "tree B: $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::platform builds diverge - converter is NOT byte-deterministic"
            diff <(cd "${legs[0]}" && find . -type f ! -name ".build-provenance.txt" | sort) \
                 <(cd "${legs[1]}" && find . -type f ! -name ".build-provenance.txt" | sort) || true
            exit 1
          fi
          echo "cross-platform determinism: OK"

  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          enable-cache: true

      - name: Lint (ruff)
        run: uv run --frozen ruff check tools

      - name: Unit tests (pytest)
        run: uv run --frozen pytest -q
