name: Feature or improvement
description: Suggest an improvement to the plugin, a skill, or the port
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For roadmap-level suggestions, note that the port follows the
        adaptation plan's staging (see the repo's docs). Concrete, scoped
        suggestions with an acceptance criterion are the most actionable.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - a skill's content or behavior
        - the model panel / config
        - delegation / subagents
        - admin dashboard
        - porting / dual-load
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what problem does it solve? Include an acceptance criterion if you can.
    validations:
      required: true
