name: Bug report
description: Report a problem with the pstack plugin on hermes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: search existing issues. This repository is the native
        hermes package for the pstack method — if the same problem reproduces
        without this port (plain upstream pstack), it belongs upstream instead.
  - type: dropdown
    id: surface
    attributes:
      label: Affected skill or surface
      options:
        - poteto-mode (router)
        - a playbook (which one?)
        - a workflow skill (how/why/tdd/...)
        - a principle skill
        - setup-pstack (model panel)
        - install / update (`hermes plugins`)
        - other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is the plugin installed?
      options:
        - hermes plugins install iap/pstack-hermes (root, default branch)
        - a pinned --ref install
        - legacy subdir install
        - a dist fork
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What did you expect, and what happened instead?
      description: One sentence of expected behaviour, one of actual. Keep the
        symptom here; the repro goes below.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact command or steps another person can run to see it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, error output, or a minimal reproduction. The most
        useful things to attach are the output of `hermes plugins doctor pstack
        --ci` and `hermes --version`.
    validations:
      required: false
