name: Bug report
description: Report a problem with the pstack plugin on hermes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: search existing issues. This port is a **dual-load**
        package — some surfaces differ between hermes and Cursor, so say which
        platform you are on. Bugs caused by the port's own adaptations belong
        here; upstream pstack bugs belong in the upstream repo.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - hermes
        - Cursor (dual-load)
        - Both platforms
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill or surface
      options:
        - poteto-mode (router)
        - a playbook (which one?)
        - a workflow skill (how/why/tdd/…)
        - a principle skill
        - setup-pstack
        - install / loader
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What did you expect, and what happened instead?
      description: One sentence of expected behaviour, one of actual. Keep the
        symptom here; the repro goes below.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact command or steps another person can run to see it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, error output, or a minimal reproduction. On
        hermes, `hermes plugins doctor <package> --ci` output is the most
        useful thing you can attach.
    validations:
      required: false
