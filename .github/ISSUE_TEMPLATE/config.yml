blank_issues_enabled: false
contact_links:
  - name: Report a bug or config problem
    url: https://github.com/iap/pstack-hermes/issues/new?template=bug_report.yml
    about: Bugs, install or configuration problems, or anything the port's adaptations cause — report here, not upstream.
  - name: Suggest a feature
    url: https://github.com/iap/pstack-hermes/issues/new?template=feature_request.yml
    about: Roadmap-level or scoped improvements to the plugin, a skill, or the port.
  - name: Fix or clarify the docs
    url: https://github.com/iap/pstack-hermes/issues/new?template=docs.yml
    about: Wording fixes, missing explanations, or stale promises in the port's documentation.
  - name: Questions about the method
    url: https://github.com/cursor/plugins/tree/main/pstack
    about: The upstream pstack method by Lauren Tan — read the poteto-mode skill first; many questions are answered by it.