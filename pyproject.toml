[project]
name = "pstack-hermes-plugin-tools"
version = "0.3.0"
description = "Converter and validator tooling for the pstack Cursor->hermes port (the shipped package itself is content-only and needs no Python)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pyyaml>=6.0", "pytest>=9.0.3,<10", "ruff>=0.16.4,<0.17"]

[tool.uv]
# Tooling repo, not an installable package.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pstack", ".venv"]

[tool.ruff.lint]
# pycodestyle errors (default classes) + pyflakes + isort + pyupgrade + bugbear.
# E501 is excluded: the converter's anchor literals are long data strings by nature.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
# Hermetic basetemp: the user Temp dir can hold locked/foreign pytest roots.
addopts = "--basetemp=.pytest-tmp"
